<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#7C65EF">
  <meta name="description" content="韩语词源记忆系统 - KoreanMemory">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="韩语记忆">
  
  <title>KoreanMemory</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  
  <link rel="stylesheet" href="lib/all.min.css?v=22">
  <link rel="stylesheet" href="css/main.css?v=22">
  <link rel="stylesheet" href="css/components.css?v=22">
  <link rel="stylesheet" href="css/dark.css?v=22">
</head>
<body>
  <div id="app">
    <header id="app-header"></header>
    <main id="app-content"></main>
    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>
  
  <div id="toast" class="toast hidden"></div>
  <div id="loading" class="loading-overlay">
    <div class="loading-spinner"></div>
    <p class="loading-text">加载中...</p>
  </div>

  <script src="sql-wasm.js?v=22"></script>
  <script src="js/db.js?v=22"></script>
  <script src="js/sm2.js?v=22"></script>
  <script src="js/points.js?v=22"></script>
  <script src="js/tts.js?v=22"></script>
  <script src="js/quotes.js?v=22"></script>
  <script src="js/pwa.js?v=22"></script>

  <!-- 页面和组件必须在 app.js 之前加载 -->
  <script src="js/pages/home.js?v=22"></script>
  <script src="js/pages/wordList.js?v=22"></script>
  <script src="js/pages/wordDetail.js?v=22"></script>
  <script src="js/pages/study.js?v=22"></script>
  <script src="js/pages/review.js?v=22"></script>
  <script src="js/pages/search.js?v=22"></script>
  <script src="js/pages/favorites.js?v=22"></script>
  <script src="js/pages/settings.js?v=22"></script>
  <script src="js/pages/stats.js?v=22"></script>
  <script src="js/pages/topics.js?v=22"></script>
  <script src="js/pages/quiz.js?v=22"></script>
  <script src="js/pages/points.js?v=22"></script>

  <script src="js/components/wordCard.js?v=22"></script>
  <script src="js/components/conjugationList.js?v=22"></script>
  <script src="js/components/hanjaTree.js?v=22"></script>
  <script src="js/components/searchBar.js?v=22"></script>

  <script src="js/app.js?v=22"></script>
  
  <!-- 超时保护：10秒后强制隐藏 loading 层 -->
  <script>
    setTimeout(function() {
      var loading = document.getElementById('loading');
      if (loading && !loading.classList.contains('hidden')) {
        loading.classList.add('hidden');
      }
    }, 10000);
  </script>
</body>
</html>
